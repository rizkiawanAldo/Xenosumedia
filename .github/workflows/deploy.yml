name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Cache generated thumbnails — key changes only when source images change.
      # On a cache hit, build-images.mjs skips sharp for existing thumbs.
      - name: Cache thumbnails
        uses: actions/cache@v4
        with:
          path: public/thumbs
          key: thumbs-${{ hashFiles('src/assets/photos/**', 'src/assets/banner/**') }}
          restore-keys: thumbs-

      # Generates WebP thumbnails + writes src/generated/manifest.json
      # (also runs automatically as part of `npm run build` via prebuild hook)
      - name: Generate image thumbnails & manifest
        run: node ./scripts/build-images.mjs

      - name: Build
        run: npm run build
        env:
          VITE_ADMIN_PASS_HASH: ${{ secrets.VITE_ADMIN_PASS_HASH }}
          VITE_GITHUB_PAT: ${{ secrets.VITE_GITHUB_PAT }}
          VITE_GITHUB_OWNER: rizkiawanAldo
          VITE_GITHUB_REPO: Xenosumedia
          VITE_GITHUB_BRANCH: main

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
