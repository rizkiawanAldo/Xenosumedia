<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xenosumedia — feel it</title>
  <meta name="description"
    content="Xenosumedia photography portfolio — portraits, events, sports, and landscapes. Feel the story in every frame." />

  <!-- Theme -->
  <meta name="theme-color" content="#0d0d0d" />
  <meta name="color-scheme" content="dark" />

  <!-- Preload LCP hero banner thumbnail (above the fold, highest priority) -->
  <link rel="preload" href="thumbs/DSC05560-800.webp" as="image" type="image/webp" />

  <!-- Preload first-row gallery thumbnails so they're ready when React renders -->
  <link rel="preload" href="thumbs/20240113-DSC01875-800.webp" as="image" type="image/webp" />
  <link rel="preload" href="thumbs/20250920-XNS00562-800.webp" as="image" type="image/webp" />
  <link rel="preload" href="thumbs/20251011-XNS03393-800.webp" as="image" type="image/webp" />
  <link rel="preload" href="thumbs/20251011-XNS03439-800.webp" as="image" type="image/webp" />

  <!-- Google Fonts: preconnect first, then load -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,400;1,600;1,700&display=swap"
    rel="stylesheet" />

  <!-- DNS prefetch -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com" />
  <link rel="dns-prefetch" href="//fonts.gstatic.com" />

  <!-- Critical above-the-fold CSS (dark theme) -->
  <style>
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #e8e8e8;
      background: #0d0d0d;
      -webkit-font-smoothing: antialiased;
    }

    .site {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(13, 13, 13, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
    }

    .site-header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-logo {
      height: 52px;
      width: auto;
      display: block;
    }

    .hero {
      position: relative;
      padding: 0;
      aspect-ratio: 16 / 6;
      min-height: 220px;
      max-height: 760px;
      width: 100%;
      contain: layout style paint;
      overflow: hidden;
    }

    .hero-bg {
      position: absolute;
      inset: 0;
      background: #050505;
      background-size: cover;
      background-position: center;
    }

    .hero-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      will-change: transform;
      opacity: 0.75;
    }

    .hero-scrim {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0.55) 60%, rgba(13, 13, 13, 0.95) 100%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(2.6rem, 7vw, 5rem);
      font-weight: 700;
      font-style: italic;
      letter-spacing: -0.01em;
      margin: 0;
      color: #fff;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.7);
    }

    .hero-subtitle {
      margin: 14px 0 0;
      color: #c9a84c;
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
